<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dutoza API — Developer Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033}
.box{width:min(430px,92%);background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:32px;box-shadow:0 15px 40px #0000000d}
.logo{width:45px;height:45px;border-radius:12px;background:#2563eb;color:#fff;display:grid;place-items:center;font-size:21px;font-weight:900;margin-bottom:20px}
h1{margin:0 0 7px;font-size:27px}
p{color:#64748b;margin:0 0 25px}
label{display:block;font-size:13px;font-weight:700;margin:15px 0 7px}
input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;outline:none}
input:focus{border-color:#2563eb}
button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}
button:hover{background:#1d4ed8}
.alert{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:11px;border-radius:8px;font-size:13px}
.bottom{text-align:center;margin-top:20px;font-size:14px;color:#64748b}
a{color:#2563eb;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="box">
<div class="logo">D</div>
<h1>Developer Login</h1>
<p>Sign in to manage your Dutoza API account.</p>

{% with messages = get_flashed_messages() %}
{% if messages %}
<div class="alert">{{ messages[-1] }}</div>
{% endif %}
{% endwith %}

<form method="POST" action="/developers/login">
<label>Email</label>
<input type="email" name="email" placeholder="developer@example.com" required>

<label>Password</label>
<input type="password" name="password" placeholder="Your password" required>

<button type="submit">Sign in</button>
</form>

<div class="bottom">
Don't have an account?
<a href="/developers/register">Create one</a>
</div>
</div>
</body>
</html>
