<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dutoza API — Create Developer Account</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
min-height:100vh;
display:grid;
place-items:center;
background:#f5f7fb;
font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
color:#172033;
padding:20px
}
.box{
width:min(460px,100%);
background:#fff;
border:1px solid #e5e7eb;
border-radius:16px;
padding:32px;
box-shadow:0 15px 40px #0000000d
}
.logo{
width:45px;
height:45px;
border-radius:12px;
background:#2563eb;
color:#fff;
display:grid;
place-items:center;
font-size:21px;
font-weight:900;
margin-bottom:20px
}
h1{margin:0 0 7px;font-size:27px}
p{color:#64748b;margin:0 0 25px;line-height:1.5}
label{
display:block;
font-size:13px;
font-weight:700;
margin:15px 0 7px
}
input{
width:100%;
padding:12px;
border:1px solid #cbd5e1;
border-radius:8px;
outline:none;
font-size:14px
}
input:focus{border-color:#2563eb}
button{
width:100%;
margin-top:22px;
padding:12px;
border:0;
border-radius:8px;
background:#2563eb;
color:#fff;
font-weight:800;
cursor:pointer;
font-size:14px
}
button:hover{background:#1d4ed8}
.alert{
background:#fef2f2;
color:#b91c1c;
border:1px solid #fecaca;
padding:11px;
border-radius:8px;
font-size:13px;
margin-bottom:15px
}
.bottom{
text-align:center;
margin-top:20px;
font-size:14px;
color:#64748b
}
a{
color:#2563eb;
text-decoration:none;
font-weight:700
}
.note{
font-size:12px;
color:#64748b;
margin-top:8px
}
</style>
</head>

<body>

<div class="box">

<div class="logo">D</div>

<h1>Create Developer Account</h1>

<p>
Create your Dutoza API developer account and get an API key automatically.
</p>

{% with messages = get_flashed_messages() %}
{% if messages %}
<div class="alert">{{ messages[-1] }}</div>
{% endif %}
{% endwith %}

<form method="POST" action="/developers/register">

<label>Full name</label>
<input
type="text"
name="name"
placeholder="Your full name"
autocomplete="name"
required
>

<label>Email</label>
<input
type="email"
name="email"
placeholder="developer@example.com"
autocomplete="email"
required
>

<label>Password</label>
<input
type="password"
name="password"
id="password"
placeholder="At least 8 characters"
autocomplete="new-password"
minlength="8"
required
>

<div class="note">
Use at least 8 characters.
</div>

<label>Confirm password</label>
<input
type="password"
id="confirm_password"
placeholder="Repeat your password"
autocomplete="new-password"
required
>

<button type="submit">Create Account</button>

</form>

<div class="bottom">
Already have an account?
<a href="/developers/login">Sign in</a>
</div>

</div>

<script>
document.querySelector("form").addEventListener("submit", function(e) {
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm_password").value;

    if (password !== confirm) {
        e.preventDefault();
        alert("Passwords do not match.");
    }
});
</script>

</body>
</html>
