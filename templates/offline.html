<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Huna mtandao — Mercfy</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f6f7; color: #1f2937; }
  @media (prefers-color-scheme: dark) { body { background: #0b1120; color: #e5e7eb; } .sub { color: #94a3b8 !important; } }
  .logo { width: 84px; height: 84px; border-radius: 22px; margin: 0 auto 22px; display: grid; place-items: center;
    background: linear-gradient(135deg, #1EB53A, #00A3DD 55%, #7c3aed); color: #fff; font-size: 44px; font-weight: 900; }
  h1 { margin: 0 0 8px; font-size: 22px; }
  .sub { margin: 0 auto 24px; max-width: 320px; color: #64748b; line-height: 1.5; }
  button { border: 0; border-radius: 14px; padding: 13px 26px; font-size: 16px; font-weight: 800; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #1EB53A, #00A3DD); font-family: inherit; }
</style>
</head>
<body>
  <main>
    <div class="logo">I</div>
    <h1>Huna mtandao</h1>
    <p class="sub">Angalia muunganisho wako wa intaneti, kisha jaribu tena.</p>
    <button type="button" onclick="location.reload()">Jaribu tena</button>
  </main>
</body>
</html>
